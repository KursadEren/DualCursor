name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish single exe
        working-directory: windows
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o ../out
      - uses: actions/upload-artifact@v4
        with:
          name: DualCursor-windows
          path: out/DualCursor.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: macos
        run: swift build -c release --arch arm64 --arch x86_64
      - name: Package
        run: |
          mkdir out
          cp "$(cd macos && swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/DualCursor" out/DualCursor-macos
      - uses: actions/upload-artifact@v4
        with:
          name: DualCursor-macos
          path: out/DualCursor-macos

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Zip Windows exe
        run: cd dist && zip -9 DualCursor-windows.zip DualCursor.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Son sürüm
          prerelease: true
          make_latest: true
          files: |
            dist/DualCursor-windows.zip
            dist/DualCursor.exe
            dist/DualCursor-macos
